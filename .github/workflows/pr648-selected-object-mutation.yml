name: PR648 selected object mutation baseline

on:
  push:
    branches:
      - validation/pr648-selected-object-mutation

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - run: dotnet restore
      - run: dotnet test tests/CodeBeam.MudBlazor.Extensions.UnitTests/CodeBeam.MudBlazor.Extensions.UnitTests.csproj --configuration Release -f net10.0 --filter FullyQualifiedName~SelectedObjectMutation_ClosedSingleSelect_UpdatesDisplayedTextOnRerender
