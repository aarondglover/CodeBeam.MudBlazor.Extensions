name: Select architecture validation

on:
  push:
    branches:
      - validation/select-architecture-benchmark
    paths:
      - .github/workflows/select-architecture-validation.yml

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture/select-value-state

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --configuration Release -f net10.0 --collect:"XPlat Code Coverage"
