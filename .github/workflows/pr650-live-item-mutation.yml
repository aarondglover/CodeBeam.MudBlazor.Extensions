name: PR650 live item mutation probe

on:
  push:
    branches:
      - validation/pr650-live-item-mutation

concurrency:
  group: pr650-live-item-mutation
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        timeout-minutes: 5
        run: dotnet restore -m:1

      - name: Build
        timeout-minutes: 7
        run: dotnet build --no-restore -m:1

      - name: Run focused live-mutation bUnit probes
        timeout-minutes: 5
        run: >
          dotnet test
          tests/CodeBeam.MudBlazor.Extensions.UnitTests/CodeBeam.MudBlazor.Extensions.UnitTests.csproj
          --configuration Release
          -f net10.0
          --no-restore
          --filter FullyQualifiedName~SelectExtendedLiveItemMutationTests
          -m:1
