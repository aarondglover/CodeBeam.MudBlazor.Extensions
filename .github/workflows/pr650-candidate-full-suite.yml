name: PR650 clean candidate full suite

on:
  push:
    branches:
      - validation/pr650-presentation-refresh-candidate

concurrency:
  group: pr650-clean-candidate-full-suite
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run net10 unit tests
        timeout-minutes: 4
        run: >
          dotnet test
          tests/CodeBeam.MudBlazor.Extensions.UnitTests/CodeBeam.MudBlazor.Extensions.UnitTests.csproj
          --configuration Release
          -f net10.0
          -m:1
          -v:q
          -clp:ErrorsOnly
          --blame-hang-timeout 60s
