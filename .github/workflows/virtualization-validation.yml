name: Virtualization validation

on:
  push:
    branches:
      - fix/virtualized-list-selection-state
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          dotnet build --no-restore 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virtualization-build-log
          path: build.log

      - name: Test
        run: dotnet test --configuration Release -f net10.0 --collect:"XPlat Code Coverage"
