name: Virtualization benchmark probe

on:
  push:
    branches:
      - benchmarks/virtualized-list-selection-state
  pull_request:
    branches:
      - dev
    paths:
      - 'benchmarks/**'
      - '.github/workflows/virtualization-benchmark-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run baseline and fixed probes
        shell: pwsh
        run: ./benchmarks/run-virtualization-benchmarks.ps1 -ProbeOnly -BaselineRef "7b5faf7ebb7666558d13c447313e9b09c92a110d" -ResultsDirectory "$env:GITHUB_WORKSPACE/benchmark-results"

      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virtualization-benchmark-probe
          path: benchmark-results

  quick-benchmark:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run focused BenchmarkDotNet comparison
        shell: pwsh
        run: ./benchmarks/run-virtualization-benchmarks.ps1 -SkipProbe -Quick -BaselineRef "7b5faf7ebb7666558d13c447313e9b09c92a110d" -BenchmarkFilter "*SelectInitialRenderBenchmarks*" -ResultsDirectory "$env:GITHUB_WORKSPACE/benchmark-results"

      - name: Upload BenchmarkDotNet results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virtualization-benchmark-quick
          path: benchmark-results
