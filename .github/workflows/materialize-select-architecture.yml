name: Materialize select architecture candidate

on:
  push:
    branches:
      - architecture/select-value-state-bootstrap

permissions:
  contents: write

jobs:
  validate-and-materialize:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize candidate from #648
        shell: bash
        run: |
          set -euo pipefail
          cp .github/architecture-select-value-state.patch.gz.b64 /tmp/candidate.b64
          base64 -d /tmp/candidate.b64 | gzip -d > /tmp/candidate.patch

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --hard e7020d49a824a371ab3f3450255f10d9cfad8783
          git clean -fdx
          git am /tmp/candidate.patch

          test "$(git rev-parse HEAD^{tree})" = "1af6d104489931a44bd1b76fa893f909f520f51a"
          git diff --check HEAD^

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --configuration Release -f net10.0 --collect:"XPlat Code Coverage"

      - name: Publish validated architecture branch
        shell: bash
        run: git push origin HEAD:refs/heads/architecture/select-value-state --force
